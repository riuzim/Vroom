name: Deploy Vroom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinadas por commit SHA (tags são mutáveis). MAJOR comentado acima.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @vroom/shared build

      - name: Generate Prisma client
        run: pnpm --filter @vroom/api exec prisma generate

      - name: Tests
        run: pnpm -r test

      # Bloqueia HIGH/CRITICAL em dependências de RUNTIME (--prod).
      # Advisories em build-time (tailwind/prisma CLI) são aceitos.
      - name: Audit de dependências (bloqueia em high/critical em runtime)
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm --filter @vroom/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Client ID OAuth é público por design (fica no HTML de qualquer
          # site com login Google). Secret vazio usa o do projeto atual.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '350618645405-d0gnaqppgke03hsin3bs916qm52blm72.apps.googleusercontent.com' }}
          # URL pública do site — ativa robots.txt + sitemap.xml no build
          # (apps/web/vite.config.js). Valor público do Pages atual como
          # default; ao comprar domínio próprio, crie o secret VITE_SITE_URL.
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://riuzim.github.io/Vroom' }}

      # GitHub Pages não reescreve rotas: deep links (/Vroom/game/daily etc.)
      # precisam cair no index.html (SPA fallback).
      - name: SPA fallback (404.html)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
